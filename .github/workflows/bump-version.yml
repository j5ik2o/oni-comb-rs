name: bump-version

on:
  workflow_dispatch:
    inputs:
      crate:
        description: 'Crate to bump'
        required: true
        type: choice
        options:
          - oni-comb-parser
          - oni-comb-crond
          - oni-comb-uri
      dry_run:
        description: 'Set true to preview the next version without creating commits, tags, or releases'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: bump-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    name: Conventional Release (${{ inputs.crate }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - name: Configure Git User
        run: |
          git config user.name "oni-comb-release-bot"
          git config user.email "release-bot@oni-comb.dev"
      - name: Set crate-specific variables
        id: vars
        run: |
          case "${{ inputs.crate }}" in
            oni-comb-parser)
              echo "tag_prefix=oni-comb-parser-v" >> "$GITHUB_OUTPUT"
              echo "version_file=modules/parser/Cargo.toml" >> "$GITHUB_OUTPUT"
              echo "changelog_file=modules/parser/CHANGELOG.md" >> "$GITHUB_OUTPUT"
              echo "git_path=modules/parser" >> "$GITHUB_OUTPUT"
              ;;
            oni-comb-crond)
              echo "tag_prefix=oni-comb-crond-v" >> "$GITHUB_OUTPUT"
              echo "version_file=modules/crond/Cargo.toml" >> "$GITHUB_OUTPUT"
              echo "changelog_file=modules/crond/CHANGELOG.md" >> "$GITHUB_OUTPUT"
              echo "git_path=modules/crond" >> "$GITHUB_OUTPUT"
              ;;
            oni-comb-uri)
              echo "tag_prefix=oni-comb-uri-v" >> "$GITHUB_OUTPUT"
              echo "version_file=modules/uri/Cargo.toml" >> "$GITHUB_OUTPUT"
              echo "changelog_file=modules/uri/CHANGELOG.md" >> "$GITHUB_OUTPUT"
              echo "git_path=modules/uri" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Generate Changelog and Bump Version
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6
        with:
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          git-message: 'chore(release): {version}'
          git-user-name: 'oni-comb-release-bot'
          git-user-email: 'release-bot@oni-comb.dev'
          preset: 'conventionalcommits'
          tag-prefix: ${{ steps.vars.outputs.tag_prefix }}
          output-file: ${{ steps.vars.outputs.changelog_file }}
          release-count: '0'
          version-file: ${{ steps.vars.outputs.version_file }}
          version-path: 'package.version'
          git-path: ${{ steps.vars.outputs.git_path }}
          skip-on-empty: 'true'
          skip-commit: ${{ inputs.dry_run }}
          skip-tag: ${{ inputs.dry_run }}
          skip-git-pull: 'true'
          skip-ci: 'false'
          git-push: 'false'
      - name: Push Changes
        if: ${{ steps.changelog.outputs.skipped == 'false' && inputs.dry_run == false }}
        env:
          PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${PAT}@github.com/${{ github.repository }}.git
          git push origin HEAD:${GITHUB_REF_NAME}
          git push origin ${{ steps.changelog.outputs.tag }}
      - name: Create GitHub Release
        if: ${{ steps.changelog.outputs.skipped == 'false' && inputs.dry_run == false }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
